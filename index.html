<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPX Аналитика — Просмотрщик треков</title>

  <!-- Leaflet CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      touch-action: manipulation;
    }

    #progress-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
      z-index: 4000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .progress-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .progress-bar-bg {
      background: var(--bg-dark);
      border-radius: 10px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.2s;
    }

    .error-log {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 8px;
      max-height: 80px;
      overflow-y: auto;
      text-align: left;
    }

    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2000;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-dark);
      padding: 4px;
      border-radius: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    .btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
    }

    .tab-content.active { display: block; }

    #view-list {
      height: 100%;
      overflow-y: auto;
      padding: 16px;
    }

    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .track-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
    }

    .card-thumb-container {
      height: 160px;
      width: 100%;
      background: #0f172a;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-val { color: var(--text-main); font-weight: 600; }

    #view-detail {
      position: absolute;
      inset: 0;
      background-color: var(--bg-dark);
      z-index: 3000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
    }

    .detail-header {
      padding: 12px 16px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .detail-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .detail-map-box {
      height: 380px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
    }

    .stat-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; }
    .stat-number { font-size: 1.15rem; font-weight: 700; }

    .charts-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
    }

    .chart-wrapper { position: relative; height: 150px; width: 100%; }
    .chart-canvas { width: 100%; height: 100%; display: block; }

    #view-all-map { width: 100%; height: 100%; }
    .empty-state { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 60vh; gap: 16px; text-align: center; color: var(--text-muted); }
    input[type="file"] { display: none; }

    @media (max-width: 640px) {
      header { flex-wrap: wrap; }
      .tabs { order: 3; width: 100%; justify-content: center; }
      .stats-summary { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <div id="progress-overlay">
    <div class="progress-box">
      <h3 id="progress-status">Обработка файлов...</h3>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <div id="progress-text" style="font-size:0.85rem; color:var(--text-muted)">Подготовка...</div>
      <div id="error-log" class="error-log"></div>
    </div>
  </div>

  <header>
    <div class="brand" onclick="goHome()">🗺️ GPX Аналитика</div>
    <div>
      <button class="btn" onclick="document.getElementById('file-input').click()">+ Импорт GPX</button>
      <input type="file" id="file-input" accept=".gpx,.tcx,.fit,.gz" multiple>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('list')">Мои Треки</button>
      <button class="tab-btn" onclick="switchTab('all-map')">Общая Карта</button>
    </div>
  </header>

  <main>
    <div id="tab-list" class="tab-content active">
      <div id="view-list">
        <div id="track-grid" class="track-grid"></div>
        <div id="empty-state" class="empty-state">
          <h2>Нет загруженных GPX файлов</h2>
          <p>Выберите файлы для начала работы</p>
          <button class="btn" onclick="document.getElementById('file-input').click()">+ Выбрать файлы</button>
        </div>
      </div>

      <div id="view-detail">
        <div class="detail-header">
          <button class="btn" style="background: transparent; border: 1px solid var(--border);" onclick="closeDetail()">← Назад</button>
          <h2 id="detail-title" style="font-size:1rem;">Название трека</h2>
        </div>
        <div class="detail-container">
          <div class="stats-summary">
            <div class="stat-card"><div class="stat-label">Дата</div><div id="stat-date" class="stat-number">--</div></div>
            <div class="stat-card"><div class="stat-label">Дистанция</div><div id="stat-dist" class="stat-number">0 км</div></div>
            <div class="stat-card"><div class="stat-label">Время</div><div id="stat-time" class="stat-number">00:00</div></div>
            <div class="stat-card"><div class="stat-label">Ср. скорость</div><div id="stat-avg-speed" class="stat-number">0 км/ч</div></div>
            <div class="stat-card"><div class="stat-label">Макс. скорость</div><div id="stat-max-speed" class="stat-number">0 км/ч</div></div>
            <div class="stat-card"><div class="stat-label">Подъем</div><div id="stat-ele-gain" class="stat-number">0 м</div></div>
          </div>

          <div id="detail-map-box" class="detail-map-box">
            <div id="detail-map" style="width: 100%; height: 100%;"></div>
          </div>

          <div class="charts-container">
            <div class="chart-wrapper"><canvas id="speedCanvas" class="chart-canvas"></canvas></div>
            <div class="chart-wrapper"><canvas id="eleCanvas" class="chart-canvas"></canvas></div>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-all-map" class="tab-content">
      <div id="view-all-map"></div>
    </div>
  </main>

  <script>
    const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    let tracksData = [];
    let detailMap = null, allMap = null, currentDetailTrack = null;

    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processSelectedFiles(Array.from(e.target.files));
        e.target.value = '';
      }
    });

    // Безопасное чтение через FileReader
    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Не удалось прочитать файл"));
        reader.readAsArrayBuffer(file);
      });
    }

    async function processSelectedFiles(files) {
      const overlay = document.getElementById('progress-overlay');
      const barEl = document.getElementById('progress-bar');
      const textEl = document.getElementById('progress-text');
      const errorLogEl = document.getElementById('error-log');

      overlay.style.display = 'flex';
      barEl.style.width = '0%';
      errorLogEl.innerHTML = '';

      let processed = 0, skippedCount = 0;

      for (const file of files) {
        try {
          const buffer = await readFileAsArrayBuffer(file);
          const parsed = await parseTrackFile(buffer, file.name);
          if (parsed && parsed.points.length >= 2) {
            tracksData.push(parsed);
          } else {
            skippedCount++;
            errorLogEl.innerHTML += `<div>Пропущен ${file.name}: не удалось найти точки</div>`;
          }
        } catch (err) {
          skippedCount++;
          errorLogEl.innerHTML += `<div>Ошибка ${file.name}: ${err.message}</div>`;
        } finally {
          processed++;
          barEl.style.width = `${Math.round((processed / files.length) * 100)}%`;
          textEl.textContent = `Обработано ${processed} из ${files.length}`;
        }
      }

      setTimeout(() => { overlay.style.display = 'none'; }, 300);
      renderTrackGrid();
    }

    async function parseTrackFile(buffer, fileName) {
      const text = new TextDecoder('utf-8').decode(buffer);
      return parseGPX(text, fileName);
    }

    function parseGPX(xmlText, fileName) {
      const rawPoints = [];
      let name = fileName.replace(/\.[^/.]+$/, "");

      // 1. Попытка распарсить стандартным XML-декодером
      try {
        const xml = new DOMParser().parseFromString(xmlText, "text/xml");
        const trkpts = xml.getElementsByTagName("trkpt");
        for (let i = 0; i < trkpts.length; i++) {
          const pt = trkpts[i];
          const lat = parseFloat(pt.getAttribute("lat"));
          const lon = parseFloat(pt.getAttribute("lon"));
          const eleNode = pt.getElementsByTagName("ele")[0];
          const timeNode = pt.getElementsByTagName("time")[0];
          const ele = eleNode ? parseFloat(eleNode.textContent) : 0;
          let time = timeNode ? new Date(timeNode.textContent.trim()).getTime() / 1000 : null;
          if (!isNaN(lat) && !isNaN(lon)) rawPoints.push({ lat, lon, ele, time });
        }
      } catch (e) {}

      // 2. Резервный REGEX-парсер
      if (rawPoints.length === 0) {
        const regex = /<trkpt\s+[^>]*lat=["']([^"']+)["']\s+[^>]*lon=["']([^"']+)["'][^>]*>([\s\S]*?)<\/trkpt>/gi;
        let m;
        while ((m = regex.exec(xmlText)) !== null) {
          const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
          const eleM = m[3].match(/<ele>(.*?)<\/ele>/i);
          const timeM = m[3].match(/<time>(.*?)<\/time>/i);
          const ele = eleM ? parseFloat(eleM[1]) : 0;
          let time = timeM ? new Date(timeM[1].trim()).getTime() / 1000 : null;
          if (!isNaN(lat) && !isNaN(lon)) rawPoints.push({ lat, lon, ele, time });
        }
      }

      return processTrackPoints(rawPoints, name);
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180, dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
      return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
    }

    function processTrackPoints(rawPoints, trackName) {
      if (!rawPoints || rawPoints.length < 2) return null;
      let totalDistance = 0, eleGain = 0;
      const points = [];

      for (let i = 0; i < rawPoints.length; i++) {
        const pt = rawPoints[i];
        if (i > 0) {
          const prev = points[i - 1];
          totalDistance += getDistance(prev.lat, prev.lon, pt.lat, pt.lon);
          if (pt.ele > prev.ele) eleGain += (pt.ele - prev.ele);
        }
        points.push({ lat: pt.lat, lon: pt.lon, ele: pt.ele || 0, time: pt.time, cumDist: totalDistance / 1000, speed: 0 });
      }

      for (let i = 1; i < points.length; i++) {
        const dt = points[i].time - points[i-1].time;
        const dd = (points[i].cumDist - points[i-1].cumDist) * 1000;
        points[i].speed = (dt > 0 && dd >= 0) ? Math.min((dd / dt) * 3.6, 120) : points[i-1].speed;
      }

      const totalTimeSec = points[points.length - 1].time ? (points[points.length - 1].time - points[0].time) : 0;

      return {
        id: 'trk_' + Math.random().toString(36).substr(2, 9),
        name: trackName,
        startTimestamp: points[0].time ? points[0].time * 1000 : null,
        points: points,
        totalDistance: totalDistance / 1000,
        totalTimeSec: totalTimeSec,
        avgSpeed: totalTimeSec > 0 ? (totalDistance / 1000) / (totalTimeSec / 3600) : 0,
        maxSpeed: Math.max(...points.map(p => p.speed)),
        eleGain: eleGain
      };
    }

    function renderTrackGrid() {
      const grid = document.getElementById('track-grid');
      const empty = document.getElementById('empty-state');
      grid.innerHTML = '';

      if (tracksData.length === 0) {
        empty.style.display = 'flex';
        return;
      }
      empty.style.display = 'none';

      tracksData.forEach(track => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.onclick = () => openDetail(track.id);
        card.innerHTML = `
          <div class="card-thumb-container"><canvas class="card-thumb-canvas" data-track-id="${track.id}"></canvas></div>
          <div class="card-body">
            <div class="card-title">${track.name}</div>
            <div class="card-stats">
              <div>Дистанция: <span class="stat-val">${track.totalDistance.toFixed(2)} км</span></div>
              <div>Ср. скорость: <span class="stat-val">${track.avgSpeed.toFixed(1)} км/ч</span></div>
            </div>
          </div>
        `;
        grid.appendChild(card);
        drawThumbnail(card.querySelector('canvas'), track.points);
      });
    }

    function drawThumbnail(canvas, points) {
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.clientWidth || 280;
      const h = canvas.height = canvas.clientHeight || 140;

      let minLat = Infinity, maxLat = -Infinity, minLon = Infinity, maxLon = -Infinity;
      points.forEach(p => {
        if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
        if (p.lon < minLon) minLon = p.lon; if (p.lon > maxLon) maxLon = p.lon;
      });

      const scale = Math.min((w - 20) / ((maxLon - minLon) || 0.001), (h - 20) / ((maxLat - minLat) || 0.001));
      ctx.beginPath();
      ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;

      points.forEach((p, i) => {
        const x = 10 + (p.lon - minLon) * scale;
        const y = h - (10 + (p.lat - minLat) * scale);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function openDetail(trackId) {
      const track = tracksData.find(t => t.id === trackId);
      if (!track) return;

      document.getElementById('view-detail').style.display = 'flex';
      document.getElementById('detail-title').textContent = track.name;
      document.getElementById('stat-dist').textContent = `${track.totalDistance.toFixed(2)} км`;
      document.getElementById('stat-avg-speed').textContent = `${track.avgSpeed.toFixed(1)} км/ч`;
      document.getElementById('stat-max-speed').textContent = `${track.maxSpeed.toFixed(1)} км/ч`;
      document.getElementById('stat-ele-gain').textContent = `${Math.round(track.eleGain)} м`;

      if (detailMap) detailMap.remove();
      detailMap = L.map('detail-map').setView([track.points[0].lat, track.points[0].lon], 13);
      L.tileLayer(TILE_URL, { maxZoom: 19 }).addTo(detailMap);

      const latLngs = track.points.map(p => [p.lat, p.lon]);
      L.polyline(latLngs, { color: '#3b82f6', weight: 4 }).addTo(detailMap);
      detailMap.fitBounds(L.latLngBounds(latLngs));
    }

    function closeDetail() { document.getElementById('view-detail').style.display = 'none'; }
    function goHome() { closeDetail(); switchTab('list'); }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
      if (tab === 'list') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('tab-list').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('tab-all-map').classList.add('active');
      }
    }
  </script>
</body>
</html>
