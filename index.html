<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GPX Аналитика — Просмотрщик треков</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg-dark: #0f172a;
      --bg-card: #1e293b;
      --bg-card-hover: #334155;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: #334155;
      --success: #10b981;
      --danger: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Поддержка динамической высоты мобильных браузеров */
      overflow: hidden;
      touch-action: manipulation;
    }

    /* Progress Overlay */
    #progress-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      backdrop-filter: blur(4px);
      z-index: 4000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .progress-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .progress-bar-bg {
      background: var(--bg-dark);
      border-radius: 10px;
      height: 12px;
      width: 100%;
      overflow: hidden;
      margin: 16px 0;
      border: 1px solid var(--border);
    }

    .progress-bar-fill {
      background: var(--accent);
      height: 100%;
      width: 0%;
      transition: width 0.2s;
    }

    .error-log {
      color: var(--danger);
      font-size: 0.8rem;
      margin-top: 8px;
      max-height: 80px;
      overflow-y: auto;
      text-align: left;
    }

    /* Header */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 2000;
      flex-shrink: 0;
      gap: 12px;
    }

    .brand {
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      user-select: none;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 6px;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .brand:hover { background-color: var(--bg-card-hover); }

    .tabs {
      display: flex;
      gap: 4px;
      background: var(--bg-dark);
      padding: 4px;
      border-radius: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .tab-btn.active {
      background-color: var(--accent);
      color: #ffffff;
    }

    .actions { display: flex; gap: 8px; }

    .btn {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.2s;
      white-space: nowrap;
    }

    .btn:hover { background-color: var(--accent-hover); }

    main {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .tab-content {
      display: none;
      width: 100%;
      height: 100%;
    }

    .tab-content.active { display: block; }

    /* Tab 1 - List */
    #view-list {
      height: 100%;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    .track-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .track-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s, border-color 0.2s;
      display: flex;
      flex-direction: column;
    }

    .track-card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
    }

    .card-thumb-container {
      height: 160px;
      width: 100%;
      background: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-thumb-canvas {
      width: 100%;
      height: 100%;
    }

    .card-body {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stat-val {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Detail View */
    #view-detail {
      position: absolute;
      inset: 0;
      background-color: var(--bg-dark);
      z-index: 3000;
      display: none;
      flex-direction: column;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .detail-header {
      padding: 12px 16px;
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .detail-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    .detail-map-box {
      height: 380px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      position: relative;
    }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(8px);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .map-legend {
      position: absolute;
      bottom: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.7rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .legend-bar {
      height: 6px;
      width: 100px;
      border-radius: 3px;
      background: linear-gradient(to right, hsl(120, 100%, 45%), hsl(60, 100%, 45%), hsl(0, 100%, 45%));
    }

    .legend-labels {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
    }

    .stats-summary {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 10px;
    }

    .stat-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .stat-label {
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .stat-number {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .charts-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px;
      position: relative;
    }

    .chart-wrapper {
      position: relative;
      height: 150px;
      width: 100%;
    }

    .chart-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    #chart-tooltip {
      position: absolute;
      top: 6px;
      right: 10px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      color: var(--text-main);
      pointer-events: none;
      display: none;
      gap: 8px;
      z-index: 5;
      flex-wrap: wrap;
    }

    /* Tab 2 - All Map */
    #view-all-map { width: 100%; height: 100%; }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: var(--text-muted);
      gap: 16px;
      text-align: center;
      padding: 0 16px;
    }

    input[type="file"] { display: none; }

    /* --- МОБИЛЬНАЯ АДАПТАЦИЯ (MEDIA QUERIES) --- */
    @media (max-width: 640px) {
      header {
        flex-wrap: wrap;
        padding: 8px 12px;
      }

      .brand {
        font-size: 1rem;
        padding: 4px 0;
      }

      .tabs {
        order: 3;
        width: 100%;
        justify-content: center;
        margin-top: 4px;
      }

      .tab-btn {
        flex: 1;
        text-align: center;
        padding: 8px;
      }

      .btn {
        padding: 6px 12px;
        font-size: 12px;
      }

      #view-list {
        padding: 12px;
      }

      .track-grid {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .card-thumb-container {
        height: 140px;
      }

      .detail-container {
        padding: 12px;
        gap: 12px;
      }

      .detail-map-box {
        height: 300px;
      }

      .stats-summary {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat-card {
        padding: 10px;
      }

      .stat-number {
        font-size: 1.05rem;
      }

      .charts-container {
        padding: 10px;
      }

      .chart-wrapper {
        height: 130px;
      }

      #chart-tooltip {
        position: relative;
        top: 0;
        right: 0;
        margin-bottom: 8px;
        justify-content: space-between;
        font-size: 0.7rem;
      }
    }
  </style>
</head>
<body>

  <!-- Progress Overlay -->
  <div id="progress-overlay">
    <div class="progress-box">
      <h3 id="progress-status">Обработка файлов...</h3>
      <div class="progress-bar-bg">
        <div id="progress-bar" class="progress-bar-fill"></div>
      </div>
      <div id="progress-text" style="font-size:0.85rem; color:var(--text-muted)">Подготовка...</div>
      <div id="error-log" class="error-log"></div>
    </div>
  </div>

  <!-- Header -->
  <header>
    <div class="brand" onclick="goHome()" title="Вернуться к списку треков">
      🗺️ GPX Аналитика
    </div>
    <div class="actions">
      <button class="btn" onclick="document.getElementById('file-input').click()">+ Импорт GPX</button>
      <input type="file" id="file-input" accept=".gpx,.tcx,.fit,.fit.gz,.gz" multiple>
    </div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('list')">Мои Треки</button>
      <button class="tab-btn" onclick="switchTab('all-map')">Общая Карта</button>
    </div>
  </header>

  <!-- Main Content -->
  <main>
    <div id="tab-list" class="tab-content active">
      <div id="view-list">
        <div id="track-grid" class="track-grid"></div>
        <div id="empty-state" class="empty-state">
          <h2>Нет загруженных GPX файлов</h2>
          <p>Выберите файлы для начала работы или перетащите их сюда</p>
          <button class="btn" style="width: auto;" onclick="document.getElementById('file-input').click()">+ Выбрать файлы</button>
        </div>
      </div>

      <!-- Detail View -->
      <div id="view-detail">
        <div class="detail-header">
          <button class="btn" style="background-color: transparent; border: 1px solid var(--border); color: var(--text-main);" onclick="closeDetail()">← Назад</button>
          <h2 id="detail-title" style="font-size:1rem; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Название трека</h2>
        </div>
        <div class="detail-container">
          <div class="stats-summary">
            <div class="stat-card">
              <span class="stat-label">Дата</span>
              <span id="stat-date" class="stat-number">--.--.----</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Дистанция</span>
              <span id="stat-dist" class="stat-number">0 км</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Время в пути</span>
              <span id="stat-time" class="stat-number">00:00</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Ср. скорость</span>
              <span id="stat-avg-speed" class="stat-number">0 км/ч</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Макс. скорость</span>
              <span id="stat-max-speed" class="stat-number">0 км/ч</span>
            </div>
            <div class="stat-card">
              <span class="stat-label">Набор высоты</span>
              <span id="stat-ele-gain" class="stat-number">0 м</span>
            </div>
          </div>

          <div id="detail-map-box" class="detail-map-box">
            <button class="fullscreen-btn" onclick="toggleMapFullscreen()">⛶ На весь экран</button>
            <div id="detail-map" style="width: 100%; height: 100%;"></div>
            <div class="map-legend">
              <div class="legend-bar"></div>
              <div class="legend-labels">
                <span id="legend-min">0</span>
                <span id="legend-max">0 км/ч</span>
              </div>
            </div>
          </div>

          <div class="charts-container" id="charts-container">
            <div id="chart-tooltip">
              <span id="tt-dist">0 км</span>
              <span id="tt-speed">0 км/ч</span>
              <span id="tt-ele">0 м</span>
              <span id="tt-time">00:00</span>
            </div>
            <div class="chart-wrapper">
              <canvas id="speedCanvas" class="chart-canvas"></canvas>
            </div>
            <div class="chart-wrapper">
              <canvas id="eleCanvas" class="chart-canvas"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="tab-all-map" class="tab-content">
      <div id="view-all-map"></div>
    </div>
  </main>

  <script>
    const TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';

    let tracksData = [];
    let detailMap = null;
    let allMap = null;
    let hoverMarker = null;
    let currentDetailTrack = null;
    let activeTabIndex = 'list';

    function createBaseTileLayer() {
      return L.tileLayer(TILE_URL, { 
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color:var(--accent);">OpenStreetMap</a> contributors'
      });
    }

    function toggleMapFullscreen() {
      const box = document.getElementById('detail-map-box');
      if (!document.fullscreenElement) {
        if (box.requestFullscreen) box.requestFullscreen();
        else if (box.webkitRequestFullscreen) box.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      setTimeout(() => {
        if (detailMap) detailMap.invalidateSize();
      }, 100);
    });

    document.getElementById('file-input').addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        processSelectedFiles(Array.from(e.target.files));
        e.target.value = '';
      }
    });

    window.addEventListener('dragover', (e) => e.preventDefault());
    window.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length > 0) {
        processSelectedFiles(Array.from(e.dataTransfer.files));
      }
    });

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>"']/g, m => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
      })[m]);
    }

    async function processSelectedFiles(files) {
      const overlay = document.getElementById('progress-overlay');
      const statusEl = document.getElementById('progress-status');
      const barEl = document.getElementById('progress-bar');
      const textEl = document.getElementById('progress-text');
      const errorLogEl = document.getElementById('error-log');

      overlay.style.display = 'flex';
      statusEl.textContent = 'Обработка файлов...';
      barEl.style.width = '0%';
      errorLogEl.innerHTML = '';

      let processed = 0;
      let skippedCount = 0;
      const total = files.length;

      for (const file of files) {
        try {
          const arrayBuffer = await file.arrayBuffer();
          const parsed = await parseTrackFile(arrayBuffer, file.name);
          if (parsed && parsed.points.length >= 2) {
            tracksData.push(parsed);
          } else {
            skippedCount++;
            errorLogEl.innerHTML += `<div>Пропущен ${escapeHtml(file.name)}: недостаточно точек</div>`;
          }
        } catch (err) {
          skippedCount++;
          errorLogEl.innerHTML += `<div>Ошибка ${escapeHtml(file.name)}: ${escapeHtml(err.message)}</div>`;
        } finally {
          processed++;
          const pct = Math.round((processed / total) * 100);
          barEl.style.width = `${pct}%`;
          textEl.textContent = `Обработано ${processed} из ${total} (пропущено: ${skippedCount})`;
        }
      }

      setTimeout(() => { overlay.style.display = 'none'; }, 300);

      tracksData.sort((a, b) => (b.startTimestamp || 0) - (a.startTimestamp || 0));
      renderTrackGrid();
      if (activeTabIndex === 'all-map') renderAllMap();
    }

    async function parseTrackFile(buffer, fileName) {
      const nameLower = fileName.toLowerCase();

      if (nameLower.endsWith('.gz')) {
        try {
          const ds = new DecompressionStream('gzip');
          const writer = ds.writable.getWriter();
          writer.write(buffer);
          writer.close();
          const decompressedArr = await new Response(ds.readable).arrayBuffer();
          const baseName = fileName.replace(/\.gz$/i, '');
          return parseTrackFile(decompressedArr, baseName);
        } catch (e) {
          throw new Error('Ошибка DecompressionStream gzip');
        }
      }

      if (nameLower.endsWith('.gpx')) {
        const text = new TextDecoder().decode(buffer);
        return parseGPX(text, fileName);
      }

      if (nameLower.endsWith('.tcx')) {
        const text = new TextDecoder().decode(buffer);
        return parseTCX(text, fileName);
      }

      if (nameLower.endsWith('.fit')) {
        return parseFIT(buffer, fileName);
      }

      return null;
    }

    function getDistance(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                Ma
